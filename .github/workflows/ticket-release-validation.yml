name: Ticket release validation
on:
  push:
    branches:
      - feature/stripe-sandbox-checkout-20261028
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://vzzabkviwyarrdkevqco.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-for-compile-only
      NEXT_PUBLIC_REAL_BOOKINGS_ENABLED: "false"
      BOOKING_EMAILS_ENABLED: "false"
      STRIPE_TEST_CHECKOUT_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Reconcile dependencies and lockfile in isolated runner
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit reconciled lockfile if changed
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: reconcile ticket PDF dependency lockfile [skip ci]"
            git push
          fi
      - name: Install from reconciled lockfile
        run: npm ci
      - name: Verify production compilation
        run: npm run build
      - name: Upload reconciled lockfile for review
        uses: actions/upload-artifact@v4
        with:
          name: updated-package-lock
          path: package-lock.json
          retention-days: 7
