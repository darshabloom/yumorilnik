name: Validate website

on:
  push:
    branches: [remake/2026]
  pull_request:
    branches: [remake/2026]

permissions:
  contents: read

jobs:
  verify:
    name: Tests, types, lint and production build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: static-validation-placeholder
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Booking business-rule tests
        run: node --experimental-strip-types --test tests/*.test.ts
      - name: Generate route types
        run: npx next typegen
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Install pinned browser test runner
        run: npm install --no-save --no-package-lock @playwright/test@1.56.1
      - name: Install Chromium and Linux dependencies
        run: npx playwright install --with-deps chromium
      - name: Mobile and desktop booking journeys
        run: npx playwright test
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  booking_database_contract:
    name: PostgreSQL booking persistence and RLS
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bookings_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: bookings_ci
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install PostgreSQL client if needed
        run: command -v psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)
      - name: Prepare isolated Supabase-like fixture
        run: psql -v ON_ERROR_STOP=1 -f tests/db/bootstrap.sql
      - name: Apply booking request schema
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261026_booking_requests.sql
      - name: Verify persistence, pricing, RLS and cancellation
        run: psql -v ON_ERROR_STOP=1 -f tests/db/booking_requests_smoke.sql
